<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Layout</title>
  <style>
    header{
      height: 100px;
      width: 100%;
      background-color: lightblue;
      text-align: center;
      line-height: 100px; /* agar teks rata tengah vertikal */
    }
    main{
      height: 300px;
      width: 100%;
      background-color: lightgreen;
      text-align: center;
      line-height: 300px;
    }
    footer{
      height: 80px;
      width: 100%;
      background-color: lightcoral;
      text-align: center;
      line-height: 80px;
    }
  </style>
</head>
<body>
  <header>Header</header>
  <main>Content</main>
  <footer>Footer</footer>
</body>
</html>

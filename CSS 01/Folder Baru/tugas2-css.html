<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>internal CSS</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: skyblue;
            margin: 20px;
            }
        h1{
            color: white;
          }
        p {
            color:#666;
            line-height: 1.6;
          }
        .heighlight{
            background-color: palegoldenrod;
            font-weight: italic;
          }
    </style>
</head>
<body>
    <h1>Judul halaman ini</h1>
    <p>Ini adalah sebuah paragraf dengan gaya CSS internal yang diterapkan</p>
    <p>Parafrag kedua, juga akan terlihat sama.</p>
    <p class="highlight">Paragraf ini menggunakan kelas 'highlight' untuk efek khusus.</p>
</body>
</html>

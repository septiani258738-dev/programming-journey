<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat From pendaftaraan dengan tabel dan fieldset</title>
</head>
<body>
    <h2>From Pendaftaran</h2>
    <from action="/submit" methode="post">
        <fieldset>
            <legend>Informasi Pribadi</legend>
            <table>
                <tr>
                    <td>Nama Lengkap:</td>
                    <td><input type="text" name="nama_lengkap" required=></td>
                </tr>
                <tr>
                    <td>Alamat Email:</td>
                    <td><input type="email" name="email" required></td>
                </tr>
                <tr>
                    <td>Nomor Telepon:</td>
                    <td><input type="tel" name="telepon" required></td>
                </tr>
            </table>
        </fieldset>
        <br>
        <fieldset>
            <lagend>Informasi Akun</lagend>
        <table>
            <tr>
                <td>Username:</td>
                <td><input type="text" name="username" required></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input typr="password" name="password" required></td>
            </tr>
        </table>
        </fieldset>
        <br>
        <input type="Submit" value="Daftar">
    </from>
</body>
</html>

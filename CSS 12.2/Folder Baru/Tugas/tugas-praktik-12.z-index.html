<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Index Tugas</title>
  <style>
    img {
      width: 200px;
      height: 200px;
      position: absolute;
    }
    .gambar1 {
      z-index: 3; 
    }
    .gambar2 {
      top: 100px;
      left: 150px;
      z-index: 2; 
    }
    .gambar3 {
      top: 150px;
      left: 300px;
      z-index: 1; 
    }
  </style>
</head>
<body>
  <img src="gambar1.jpg" alt="Gambar 1" class="gambar1">
  <img src="gambar2.jpg" alt="Gambar 2" class="gambar2">
  <img src="gambar3.jpg" alt="Gambar 3" class="gambar3">
</body>
</html>

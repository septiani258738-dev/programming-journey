<!DOCTYPE html>
<html>
<head>
    <title>Tugas Border</title>
    <style>
        .solid {
            border: 4px solid palegreen;
            padding: 10px;
            background-color: aliceblue;
        }

        .dooted {
            border: 5px dotted black;
            background-color: goldenrod;
            padding: 10px;
        }

        .double {
            border: 5px double palevioletred;
            padding: 10px;
            background-color: aliceblue;
        }

        .dashed {
            border: 4px dashed blue;
            padding: 10px;
            background-color: aliceblue;
        }

        .groove {
            border: 4px groove green;
            padding: 10px;
            background-color: aliceblue;
        }

        .ridge {
            border: 4px ridge red;
            padding: 10px;
            background-color: aliceblue;
        }

    </style>
</head>
<body>

<p class="solid">Ini adalah border solid</p>
<p class="dooted"> Ini adalah border dooted</p>
<p class="double">Ini adalah border double</p>
<p class="dashed">Ini adalah border dashed</p>
<p class="groove">Ini adalah border groove</p>
<p class="ridge">Ini adalah border ridge</p>

</body>
</html>

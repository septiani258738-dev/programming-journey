<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garis dalam CSS</title>
    <style>
        body{
            font-family: sans serif;
        }
        header{
            border: 2px solid palegoldenrod;
            text-align: center;
            margin-bottom: 1em;
        }
        article{
            border: 2px solid violet;
            padding: 1em;
            margin-bottom: 1em;
        }
        footer{
            text-align: center;
            padding: 0.5em;
            border: 2px solid grey;
        }
    </style>
</head>
<body>
    <header>Latihan CSS Border</header>
    <article>
        Ini adalah contoh paragraf artikel untuk latihan 
        properti border di CSS. Properti border adalah properti
        untuk membuat garis pada sisi elemen. Sehingga, 
        bisa terlihat ada pemisah dan menjadi kesatuan. 
    </article>
    <footer>
        &copy; 2026 CSS - X PPLG 
    </footer>
</body>
</html>

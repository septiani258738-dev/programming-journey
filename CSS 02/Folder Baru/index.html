<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index html</title>
    <link rel="stylesheet" href="tugas css eksternal.css">
</head>
<body>
    <!--selector tag-->
    <h2>Contoh Penggunaan Secector dalam HTML</h2>
    <!--selector class-->
    <div class="highlight">
        <p>Ini adalah paragraf dengan kelas highlight</p>
    </div>
    <!--selector id-->
    <div id="unique-section">
        <p>Ini adalah paragraf dalam div dengan id "unique-section"</p>
    </div>
    <!--selector universal-->
    <p>Paragraf ini menggunakan selector universal</p>
</body>
</html>

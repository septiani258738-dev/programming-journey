<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector dalam HTML</title>
    <style>
        /* Slecror Tag */
        p {
            color:blue
        }
        /*Slector Kelas */
        .highlight{
            background-color: yellow;
        }
        /*selector ID */
        #unique-section {
            border: 2px solid red;
            padding: 10px;
        }
        /* Selector Atribut */
        a[href] { 
            text-decoration: none;
            color: green
        }
        /* Selector Universal */
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Contoh Penggunaan Selector dalam HTML</h1>
    <!--Selector tag-->
    <p>Ini adalah paragraf yang mrnggunakan selector tag &lt;p&gt;.</p>
    <!--Selector Kelas-->
    <div class="highlight">
        <p>Ini adalah paragraf dengan "highlight".</p>
    </div>
    <!--Selector ID-->
    <div id="unique-section">
        <p>Ini adalah paragraf dalam div dengan ID "unique-section".</p>
    </div>
    <!--Selector Atribut-->
    <a href="https://www.example.com" target="_blank">Link dengan atribut href</a>
    <!--Selector Universal-->
    <p>Pararaf ini menggunakan selector universal.</p>
</body>
</html>
